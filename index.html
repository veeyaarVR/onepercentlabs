<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Percent Labs — Coming Soon</title>
<meta name="description" content="One Percent Labs is coming soon.">

<meta property="og:title" content="One Percent Labs">
<meta property="og:description" content="Coming soon.">
<meta property="og:type" content="website">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2238%22 fill=%22none%22 stroke=%22%236b6b7c%22 stroke-width=%223%22 opacity=%220.5%22/><line x1=%2250%22 y1=%226%22 x2=%2250%22 y2=%2222%22 stroke=%22%236366f1%22 stroke-width=%229%22 stroke-linecap=%22round%22/></svg>">

<style>
  :root {
    --bg: #0a0a0a;
    --fg: #f5f5f5;
    --muted: #888888;
    --accent: #6366f1;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    overflow: hidden;
  }

  .glow {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 600px;
    height: 600px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(99, 102, 241, 0) 70%);
    pointer-events: none;
  }

  main {
    position: relative;
    z-index: 1;
  }

  h1 {
    font-size: clamp(1.5rem, 5vw, 2.25rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 14px;
  }

  p {
    font-size: clamp(0.95rem, 2.5vw, 1.05rem);
    color: var(--muted);
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  .dot {
    color: var(--accent);
  }

  .mark {
    width: 44px;
    height: 44px;
    margin: 0 auto 28px;
    display: block;
  }

  footer {
    position: fixed;
    bottom: 28px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.75rem;
    color: #444;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <main>
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="38" fill="none" stroke="var(--muted)" stroke-width="3" opacity="0.45"/>
      <line x1="50" y1="6" x2="50" y2="22" stroke="var(--accent)" stroke-width="9" stroke-linecap="round"/>
    </svg>
    <h1>One Percent Labs<span class="dot">.</span></h1>
    <p>Something is on the way. Coming soon.</p>
  </main>
  <footer>&copy; 2026 One Percent Labs</footer>
</body>
</html>
